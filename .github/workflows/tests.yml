name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pgstac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgstac_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/pgstac_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: pgstac_test
      PGSTAC_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned pgSTAC migration package
        run: python -m pip install 'pypgstac[migrations]==0.10.0' 'psycopg[binary]==3.2.9' 'psycopg-pool==3.2.6'
      - name: Compile tests
        run: python -m compileall -q tests
      - name: Validate shell syntax for every example
        run: find examples -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Run cookbook contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell syntax
        run: bash -n examples/01-install/install-and-verify.sh
      - name: Install pgSTAC and verify schema
        run: bash examples/01-install/install-and-verify.sh
